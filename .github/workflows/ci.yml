# Compile guard for the Windows port (PLAN-windows.md step 6): keeps the
# workspace building against MSVC + GStreamer so the port can't rot between
# the machines it's actually run on. Compile-only on purpose — the runners
# have no GPU, no audio devices, and no display, so anything past `cargo
# check` would be testing the runner, not corcel.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-windows:
    name: check (windows-msvc)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The official GStreamer MSVC packages, via their chocolatey wrappers:
      # `gstreamer` is the runtime, `gstreamer-devel` the headers/.pc files.
      # Both land in C:\gstreamer\1.0\msvc_x86_64. pkgconfiglite provides the
      # pkg-config.exe that the gstreamer-sys build scripts resolve .pc files
      # with (the dev package ships the .pc files but not the tool).
      - name: Install GStreamer (MSVC) + pkg-config
        run: choco install -y --no-progress gstreamer gstreamer-devel pkgconfiglite

      # The MSI writes GSTREAMER_1_0_ROOT_MSVC_X86_64 as a *machine* env var,
      # which this already-running job never inherits — resolve it from the
      # registry, with a filesystem search as fallback, and dump what's on
      # disk if neither finds it so the failure is diagnosable from the log.
      - name: Expose GStreamer to cargo
        shell: pwsh
        run: |
          $root = [Environment]::GetEnvironmentVariable('GSTREAMER_1_0_ROOT_MSVC_X86_64', 'Machine')
          if (-not $root -or -not (Test-Path "$root\lib\pkgconfig")) {
            $candidate = Get-ChildItem 'C:\gstreamer\1.0' -Directory -ErrorAction SilentlyContinue |
              Where-Object { Test-Path "$($_.FullName)\lib\pkgconfig" } |
              Select-Object -First 1
            $root = $candidate?.FullName
          }
          if (-not $root) {
            Get-ChildItem C:\gstreamer -Recurse -Depth 3 -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            Write-Error 'no GStreamer dev install with lib\pkgconfig found'
          }
          Write-Host "GStreamer root: $root"
          Add-Content $env:GITHUB_ENV "PKG_CONFIG_PATH=$root\lib\pkgconfig"
          Add-Content $env:GITHUB_PATH "$root\bin"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # --all-targets so the test/bench targets (e.g. corcel-signal's
      # handshake test) must compile too, not just the libraries.
      - name: cargo check
        run: cargo check --workspace --all-targets --locked

  # Builds the self-contained Windows installer (corcel.exe + bundled
  # GStreamer runtime, see packaging/windows/): on demand via
  # workflow_dispatch (grab it from the run's artifacts), and on v* tags,
  # where it's also attached to a GitHub release for friends to download.
  package-windows:
    name: installer (windows)
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install GStreamer (MSVC), pkg-config, Inno Setup
        run: choco install -y --no-progress gstreamer gstreamer-devel pkgconfiglite innosetup

      - name: Expose GStreamer to cargo
        shell: pwsh
        run: |
          $root = [Environment]::GetEnvironmentVariable('GSTREAMER_1_0_ROOT_MSVC_X86_64', 'Machine')
          if (-not $root -or -not (Test-Path "$root\lib\pkgconfig")) {
            $candidate = Get-ChildItem 'C:\gstreamer\1.0' -Directory -ErrorAction SilentlyContinue |
              Where-Object { Test-Path "$($_.FullName)\lib\pkgconfig" } |
              Select-Object -First 1
            $root = $candidate?.FullName
          }
          if (-not $root) { Write-Error 'no GStreamer dev install found' }
          Write-Host "GStreamer root: $root"
          Add-Content $env:GITHUB_ENV "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root"
          Add-Content $env:GITHUB_ENV "PKG_CONFIG_PATH=$root\lib\pkgconfig"
          Add-Content $env:GITHUB_PATH "$root\bin"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo build --release
        run: cargo build --release --locked

      - name: Stage distribution
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\package.ps1

      - name: Build installer
        shell: pwsh
        run: iscc packaging\windows\corcel.iss

      - uses: actions/upload-artifact@v4
        with:
          name: corcel-setup
          path: dist/corcel-setup.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/corcel-setup.exe --generate-notes
