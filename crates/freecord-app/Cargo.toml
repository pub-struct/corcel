[package]
name = "freecord-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
gpui = "0.2"
freecord-signal = { path = "../freecord-signal" }
freecord-net = { path = "../freecord-net" }
freecord-media = { path = "../freecord-media" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
base64 = "0.23.1"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync"] }
anyhow = "1.0.104"
unicode-segmentation = "1.13.3"
image = "0.25.1"
# `bundled` compiles SQLite into the binary — the whole point is that a user
# installs nothing and configures nothing to get a durable local database.
rusqlite = { version = "0.38", features = ["bundled"] }
# Only for rendering message timestamps in the user's local timezone.
chrono = "0.4"
