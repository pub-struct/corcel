[package]
name = "corcel-signal"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
iroh = "1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "io-util"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[dev-dependencies]
uuid = { version = "1.24.0", features = ["v4"] }
